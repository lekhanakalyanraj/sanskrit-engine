# Domain gold set — grammatically simple (SVO) sentences using vocabulary from mathematics,
# philosophy, poetry, and medicine. These encode the product principle that Sanskrit expresses
# the full range of human knowledge, NOT just religion (PRD §5) — as a CI-enforced test, not a
# claim in a doc. (Real classical *verse* is far more complex than the current core handles; these
# stay simple on purpose. Domain breadth of the vocabulary is the point, not syntactic difficulty.)

# ── Mathematics ──────────────────────────────────────────────────────────────
- id: ganaka-sankhya-ganayati
  sentence_dev: "गणकः संख्यां गणयति"
  gloss_en: "The mathematician computes the number."
  domain: mathematics
  source: "composed (domain vocabulary, simple syntax)"
  tokens:
    - {slp1: gaRakas,   lemma: gaRaka, pos: noun, case: nominative, karaka: kartā}
    - {slp1: saMKyAm,   lemma: saMKyA, pos: noun, case: accusative, karaka: karma}
    - {slp1: gaRayati,  lemma: gaRi,   pos: verb}

- id: ganaka-shunya-janati
  sentence_dev: "गणकः शून्यं जानाति"
  gloss_en: "The mathematician knows zero."
  domain: mathematics
  note: "śūnya = zero — Sanskrit's own mathematical vocabulary."
  source: "composed (domain vocabulary, simple syntax)"
  tokens:
    - {slp1: gaRakas,  lemma: gaRaka, pos: noun, case: nominative, karaka: kartā}
    - {slp1: SUnyam,   lemma: SUnya,  pos: noun, case: accusative, karaka: karma}
    - {slp1: jAnAti,   lemma: jYA,    pos: verb}

