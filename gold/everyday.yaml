  tokens:
    - {slp1: bAlas,   lemma: bAla,  pos: noun, case: nominative,   karaka: kartā}
    - {slp1: hastena, lemma: hasta, pos: noun, case: instrumental, karaka: karaṇa}
    - {slp1: annam,   lemma: anna,  pos: noun, case: accusative,   karaka: karma}
    - {slp1: KAdati,  lemma: KAd,   pos: verb}

