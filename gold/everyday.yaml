#
# Gold set — hand-verified expected output of the deterministic core.
# The backbone for golden tests (structure), LLM evals (meaning), and regression.
# Assert only what the bundled lexicon gets reliably right: lemma, pos, case, kāraka.
# (gender is intentionally NOT asserted — the bundled lexicon mislabels it; fix comes with Vidyut.)
#
# Domain here is "everyday" only, because the bundled sanskrit_parser lexicon lacks the
# vocabulary of the math/poetry/philosophy lines we want. Domain breadth grows once the
# morphology engine is upgraded (Phase 1 evaluation → Vidyut). See gold/README.md.

- id: bala-phala-khadati
  sentence_dev: "बालः फलं खादति"
  gloss_en: "The boy eats fruit."
  domain: everyday
  source: "pedagogical / common usage"
  tokens:
    - {slp1: bAlas,  lemma: bAla, pos: noun, case: nominative, karaka: kartā}
    - {slp1: Palam,  lemma: Pala, pos: noun, case: accusative, karaka: karma}
    - {slp1: KAdati, lemma: KAd,  pos: verb}

- id: bala-hastena-annam-khadati
