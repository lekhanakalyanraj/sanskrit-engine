# Coverage gold set — sentences that FAILED under sanskrit_parser and now parse under Vidyut
# (see EVAL-vidyut.md). These lock in the migration's coverage win as regression protection:
#   • proper nouns (राम returned 0 analyses in Phase 0 — the canonical failure)
#   • vocabulary the bundled lexicon lacked (मुनि)

- id: rama-vana-gacchati
  sentence_dev: "रामः वनं गच्छति"
  gloss_en: "Rāma goes to the forest."
  domain: narrative
  note: "Proper noun — returned 0 analyses under sanskrit_parser (Phase-0 canonical failure)."
  source: "pedagogical / common usage"
  tokens:
    - {slp1: rAmas,   lemma: rAma, pos: noun, case: nominative, karaka: kartā}
    - {slp1: vanam,   lemma: vana, pos: noun, case: accusative, karaka: karma}
    - {slp1: gacCati, lemma: gam,  pos: verb}

- id: rama-hastena-annam-khadati
  sentence_dev: "रामः हस्तेन अन्नं खादति"
  gloss_en: "Rāma eats food with his hand."
  domain: narrative
  note: "Proper noun + three kāraka roles."
  source: "pedagogical / common usage"
  tokens:
    - {slp1: rAmas,   lemma: rAma,  pos: noun, case: nominative,   karaka: kartā}
    - {slp1: hastena, lemma: hasta, pos: noun, case: instrumental, karaka: karaṇa}
    - {slp1: annam,   lemma: anna,  pos: noun, case: accusative,   karaka: karma}
    - {slp1: KAdati,  lemma: KAd,   pos: verb}

- id: muni-jala-pibati
